aid: rever-moto
name: Rever Moto
description: >-
  REVER (Rever Moto) is a motorcycle-focused navigation, ride-tracking, and social
  platform for riders. It offers a web-based route planner and mobile apps (iOS,
  Android, and Apple CarPlay) that let motorcyclists discover more than 3,000
  curated routes worldwide, plan and sync trips, record rides with offline GPS
  tracking, and get turn-by-turn voice navigation. Social features include live
  friend tracking, ride sharing, challenges, and stories. REVER offers a free tier
  and a paid "Pro" subscription, and partners with brands including Honda, Cycle
  Gear, and Quad Lock. The company is a portfolio company of 500 Global. As of this
  enrichment pass REVER publishes no public developer API, documentation, or
  integration surface — it is a consumer mobile/web product.
